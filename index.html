<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#8a4a1f">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Тест личности: кто ты на самом деле?</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wall" id="wall" aria-hidden="true">
  <div class="wall-bricks"></div>
  <div class="wall-light"></div>
</div>

<section class="landing" id="landing">
  <div class="landing-card">
    <p class="landing-tag">Тест личности</p>
    <h1 class="landing-title">Кто ты на самом деле?</h1>
    <p class="landing-text">Отвечай честно — результат зависит только от тебя.</p>
    <ul class="landing-list">
      <li>Короткий тест на характер</li>
      <li>Без регистрации и почты</li>
      <li>Результат сразу на экране</li>
    </ul>
    <button class="btn btn-start" id="btnStart">Начать тест</button>
    <p class="landing-hint">Сайт использует звук</p>
  </div>
</section>

<main class="card is-hidden" id="card">
  <h1 class="question" id="question"></h1>
  <p class="subtitle" id="subtitle">Отвечай на вопросы</p>

  <div class="stage" id="stage">
    <button class="btn btn-yes" id="btnYes">Да</button>
    <button class="btn btn-no" id="btnNo">Нет</button>
  </div>

  <p class="answer" id="answer" hidden></p>

  <button class="btn btn-reset" id="btnReset">Заново</button>
</main>

<div class="rain" id="rain" aria-hidden="true"></div>

<audio id="player" preload="auto" playsinline webkit-playsinline></audio>

<script src="script.js"></script>
</body>
</html>
