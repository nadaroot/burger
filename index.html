<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#8a4a1f">
<title>Опросник: ты жирная свинка?</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wall" id="wall" aria-hidden="true">
  <div class="wall-bricks"></div>
  <div class="wall-light"></div>
</div>

<main class="card">
  <p class="counter" id="counter">Вопрос 1 из 6</p>
  <h1 class="question" id="question">Ты жирная свинка?</h1>
  <p class="subtitle" id="subtitle">Кнопка «Да» убегает. Она трусливая.</p>

  <div class="stage" id="stage">
    <button class="btn btn-yes" id="btnYes">Да</button>
    <button class="btn btn-no" id="btnNo">Нет</button>
  </div>

  <p class="answer" id="answer" hidden></p>

  <button class="btn btn-reset" id="btnReset">Заново</button>
</main>

<div class="rain" id="rain" aria-hidden="true"></div>

<script src="script.js"></script>
</body>
</html>
